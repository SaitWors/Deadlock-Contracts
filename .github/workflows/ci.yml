name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Audit Python dependencies
        run: |
          python -m pip_audit -r requirements.txt

      - name: Compile Python
        run: |
          python -m compileall -q app alembic tests scripts

      - name: Check critical Python lint rules
        run: |
          python -m ruff check app alembic tests scripts --select E9,F63,F7,F82

      - name: Validate release contents
        run: |
          python scripts/release_check.py .

      - name: Run backend tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q -p no:cacheprovider

  frontend:
    name: Frontend / format + types + build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.19.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Audit all dependencies
        run: |
          pnpm audit --audit-level high

      - name: Check formatting
        run: |
          pnpm exec oxfmt --check \
            src \
            vite.config.ts \
            package.json \
            index.html

      - name: Type check
        run: |
          pnpm exec tsc --noEmit

      - name: Build frontend
        run: |
          pnpm run build

      - name: Enforce frontend asset budget
        run: |
          python3 ../scripts/check_frontend_budget.py dist

  migrations:
    name: PostgreSQL / migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_USER: deadlock_ci
          POSTGRES_PASSWORD: deadlock_ci_password
          POSTGRES_DB: deadlock_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deadlock_ci -d deadlock_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://deadlock_ci:deadlock_ci_password@127.0.0.1:5432/deadlock_ci
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Bootstrap blank PostgreSQL
        run: |
          python -m app.migrate

      - name: Verify Alembic head
        run: |
          python -m alembic current --check-heads

      - name: Verify ORM schema
        run: |
          python -m alembic check

      - name: Test previous-to-current migration
        run: |
          python scripts/ci_migration_smoke.py

      - name: Verify final head
        run: |
          python -m alembic current --check-heads

  companion:
    name: Companion / tests + OPK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: companion

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Read Companion release version
        id: companion-release
        run: |
          version="$(node -p 'require("../release.json").companion_version')"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Verify release metadata
        run: |
          node scripts/check-release.mjs

      - name: Check JavaScript syntax
        run: |
          find src \
            -type f \
            -name '*.js' \
            -print0 \
            | xargs -0 -n1 node --check

      - name: Run Companion release checks
        run: |
          npm run release:check

      - name: Install OPK packaging dependency
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zip
          fi

      - name: Build Companion OPK
        env:
          COMPANION_VERSION: ${{ steps.companion-release.outputs.version }}
        run: |
          rm -rf dist

          node scripts/package-release.mjs

          OPK="dist/Deadlock-Contracts-Companion-${COMPANION_VERSION}.opk"

          FIRST_OPK_SHA="$(
            sha256sum \
              "$OPK" \
              | awk '{print $1}'
          )"

          node scripts/package-release.mjs

          SECOND_OPK_SHA="$(
            sha256sum \
              "$OPK" \
              | awk '{print $1}'
          )"

          test "$FIRST_OPK_SHA" = "$SECOND_OPK_SHA"
          echo "Reproducible OPK SHA-256: $SECOND_OPK_SHA"

          test -f \
            "$OPK"

          sha256sum \
            "$OPK" \
            | tee \
              "${OPK}.sha256"

          unzip -t \
            "$OPK"

          unzip -l \
            "$OPK" \
            | grep -E \
                'manifest.json|src/background-engine.js|index.html'

          node -e '
            const fs = require("node:fs")
            const bom = JSON.parse(fs.readFileSync(`dist/Deadlock-Contracts-Companion-${process.env.COMPANION_VERSION}.cdx.json`, "utf8"))
            if (bom.bomFormat !== "CycloneDX" || bom.specVersion !== "1.6" || !bom.components?.length) process.exit(1)
          '

      - name: Upload Companion OPK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Deadlock-Contracts-Companion-${{ steps.companion-release.outputs.version }}
          path: |
            companion/dist/Deadlock-Contracts-Companion-${{ steps.companion-release.outputs.version }}.opk
            companion/dist/Deadlock-Contracts-Companion-${{ steps.companion-release.outputs.version }}.opk.sha256
            companion/dist/Deadlock-Contracts-Companion-${{ steps.companion-release.outputs.version }}.cdx.json
            companion/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  container:
    name: Docker / release image
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - migrations
      - companion

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate production Compose
        env:
          DOMAIN: example.invalid
          CONTACT_EMAIL: ci@example.invalid
          ACME_EMAIL: ci@example.invalid
        run: |
          mkdir -p secrets

          for name in \
            postgres_password \
            database_url \
            session_secret \
            admin_totp_secret \
            deadlock_api_key \
            steam_web_api_key \
            telegram_bot_token \
            telegram_webhook_secret \
            discord_review_webhook_url
          do
            printf 'ci-placeholder\n' > "secrets/${name}.txt"
          done

          docker compose \
            -f compose.prod.yaml \
            config --quiet

      - name: Build release image
        run: |
          docker build \
            --tag deadlock-contracts:ci \
            .

      - name: Verify migration files in image
        run: |
          docker run --rm \
            --entrypoint sh \
            deadlock-contracts:ci \
            -lc '
              set -eu
              test -f /app/alembic.ini
              test -f /app/app/migrate.py
              test -f /app/app/maintenance.py
              test -f /app/alembic/versions/0007_mission_localization.py
          test -f /app/alembic/versions/0008_board_match_candidate_queue.py
              echo "release image OK"
            '
