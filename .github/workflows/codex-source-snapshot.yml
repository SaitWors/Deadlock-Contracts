name: Codex source snapshot

on:
  push:
    branches:
      - codex/remediation-20260823

permissions:
  contents: read

jobs:
  snapshot:
    name: Materialize exact PR head
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Create Git bundle
        run: |
          git bundle create deadlock-contracts-pr5.bundle HEAD

      - name: Upload source bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codex-pr5-source-${{ github.sha }}
          path: deadlock-contracts-pr5.bundle
          if-no-files-found: error
          retention-days: 1
