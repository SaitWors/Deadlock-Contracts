name: deadlock-contracts

x-app-env: &app-env
  APP_ENV: production
  APP_VERSION: 0.10.1-alpha.8
  APP_BASE_URL: https://${DOMAIN:?Set DOMAIN in .env.production}
  TRUSTED_HOSTS: ${DOMAIN},www.${DOMAIN}
  CONTACT_EMAIL: ${CONTACT_EMAIL:?Set CONTACT_EMAIL in .env.production}
  TRUST_PROXY_HEADERS: "true"
  TRUSTED_PROXY_NETWORKS: ${TRUSTED_PROXY_NETWORKS:-172.16.0.0/12,10.0.0.0/8}
  FORWARDED_ALLOW_IPS: ${TRUSTED_PROXY_NETWORKS:-172.16.0.0/12,10.0.0.0/8}
  RATE_LIMIT_REDIS_URL: redis://redis:6379/0
  DATABASE_URL_FILE: /run/secrets/database_url
  SESSION_SECRET_FILE: /run/secrets/session_secret
  SESSION_TTL_DAYS: "14"
  COOKIE_SECURE: "true"
  CLOSED_ALPHA: ${CLOSED_ALPHA:-true}
  ALPHA_ALLOWED_STEAM_IDS: ${ALPHA_ALLOWED_STEAM_IDS:-}
  OVERWOLF_QA_ACCESS_ENABLED: ${OVERWOLF_QA_ACCESS_ENABLED:-false}
  OVERWOLF_QA_ACCESS_CODE_HASH: ${OVERWOLF_QA_ACCESS_CODE_HASH:-}
  OVERWOLF_QA_ACCESS_UNTIL: ${OVERWOLF_QA_ACCESS_UNTIL:-}
  DOCS_ENABLED: "false"
  ALLOW_DEMO_AUTH: "false"
  ALLOW_DEV_ENDPOINTS: "false"
  MATCH_PROVIDER: deadlock_api
  DEADLOCK_API_BASE_URL: https://api.deadlock-api.com
  DEADLOCK_API_KEY_FILE: /run/secrets/deadlock_api_key
  DEADLOCK_API_KEY_HEADER: ${DEADLOCK_API_KEY_HEADER:-X-API-Key}
  DEADLOCK_FORCE_REFETCH: ${DEADLOCK_FORCE_REFETCH:-false}
  STORE_PROVIDER_RAW: "false"
  STEAM_WEB_API_KEY_FILE: /run/secrets/steam_web_api_key
  DISCOVERY_RETRY_SECONDS: ${DISCOVERY_RETRY_SECONDS:-600}
  MAX_DISCOVERY_ATTEMPTS: ${MAX_DISCOVERY_ATTEMPTS:-180}
  REQUEST_TIMEOUT_SECONDS: "15"
  REQUEST_CONNECT_TIMEOUT_SECONDS: "5"
  MAX_PROVIDER_RESPONSE_BYTES: "4194304"
  MAX_REQUEST_BODY_BYTES: "1048576"
  EVIDENCE_DIR: /app/runtime/evidence
  EVIDENCE_MAX_FILES: ${EVIDENCE_MAX_FILES:-4}
  EVIDENCE_MAX_FILE_BYTES: ${EVIDENCE_MAX_FILE_BYTES:-3145728}
  EVIDENCE_RETENTION_DAYS: ${EVIDENCE_RETENTION_DAYS:-30}
  ADMIN_STEAM_IDS: ${ADMIN_STEAM_IDS:-}
  ADMIN_SESSION_TTL_MINUTES: ${ADMIN_SESSION_TTL_MINUTES:-30}
  TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
  TELEGRAM_WEBHOOK_SECRET_FILE: /run/secrets/telegram_webhook_secret
  TELEGRAM_REVIEW_CHAT_ID: ${TELEGRAM_REVIEW_CHAT_ID:-}
  DISCORD_REVIEW_WEBHOOK_URL_FILE: /run/secrets/discord_review_webhook_url
  GLOBAL_RATE_LIMIT_PER_MINUTE: ${GLOBAL_RATE_LIMIT_PER_MINUTE:-240}
  AUTH_RATE_LIMIT_PER_10_MINUTES: ${AUTH_RATE_LIMIT_PER_10_MINUTES:-30}
  SYNC_RATE_LIMIT_PER_HOUR: ${SYNC_RATE_LIMIT_PER_HOUR:-20}
  CASE_MAX_ATTEMPTS: ${CASE_MAX_ATTEMPTS:-3}
  COMPANION_DOWNLOAD_URL: ${COMPANION_DOWNLOAD_URL:-}
  COMPANION_INGEST_ENABLED: ${COMPANION_INGEST_ENABLED:-true}
  COMPANION_ADS_ENABLED: ${COMPANION_ADS_ENABLED:-false}
  COMPANION_MINIMUM_VERSION: ${COMPANION_MINIMUM_VERSION:-0.5.2-alpha.5}
  REWARD_SETTLEMENT_ENABLED: ${REWARD_SETTLEMENT_ENABLED:-true}
  LOG_LEVEL: INFO

x-app-security: &app-security
  init: true
  read_only: true
  cap_drop: ["ALL"]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=64m,mode=1777
  pids_limit: 200
  mem_limit: 512m
  cpus: 1.0

services:
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      web:
        condition: service_healthy

  db:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    environment:
      POSTGRES_DB: deadlock_contracts
      POSTGRES_USER: deadlock
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deadlock -d deadlock_contracts"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 768m
    cpus: 1.0

  redis:
    image: redis:8.8.2-alpine@sha256:96cb544fa0af5aa898d160cffb7dae70c3df117190fc123831c64712cda425ff
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [data]
    read_only: true
    tmpfs:
      - /data:size=16m,mode=0700
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 96m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app-security
    build: .
    command: ["python", "-m", "app.migrate"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets: [database_url]
    networks: [data]
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app-security
    build: .
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVICE_ROLE: web
      ADMIN_TOTP_SECRET_FILE: /run/secrets/admin_totp_secret
    secrets: [database_url, session_secret, admin_totp_secret, deadlock_api_key, steam_web_api_key, telegram_bot_token, telegram_webhook_secret, discord_review_webhook_url]
    volumes:
      - evidence_data:/app/runtime/evidence
    networks: [edge, data]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; host=os.environ['TRUSTED_HOSTS'].split(',')[0]; req=urllib.request.Request('http://127.0.0.1:8080/api/ready', headers={'Host': host}); urllib.request.urlopen(req, timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 20
      start_period: 20s

  worker:
    <<: *app-security
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *app-env
      SERVICE_ROLE: worker
    secrets: [database_url, session_secret, deadlock_api_key, steam_web_api_key, telegram_bot_token, telegram_webhook_secret, discord_review_webhook_url]
    networks: [data, outbound]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

networks:
  edge:
  data:
    internal: true
  outbound:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  evidence_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  database_url:
    file: ./secrets/database_url.txt
  session_secret:
    file: ./secrets/session_secret.txt
  admin_totp_secret:
    file: ./secrets/admin_totp_secret.txt
  deadlock_api_key:
    file: ./secrets/deadlock_api_key.txt
  steam_web_api_key:
    file: ./secrets/steam_web_api_key.txt
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
  telegram_webhook_secret:
    file: ./secrets/telegram_webhook_secret.txt
  discord_review_webhook_url:
    file: ./secrets/discord_review_webhook_url.txt
