name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<10"
          python -m pip check

      - name: Compile Python
        run: |
          python -m compileall -q app alembic tests scripts

      - name: Run backend tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q -p no:cacheprovider

  frontend:
    name: Frontend / format + types + build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.10.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Check formatting
        run: |
          pnpm exec oxfmt --check \
            src \
            vite.config.ts \
            package.json \
            index.html

      - name: Type check
        run: |
          pnpm exec tsc --noEmit

      - name: Build frontend
        run: |
          pnpm run build

  migrations:
    name: PostgreSQL / migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: deadlock_ci
          POSTGRES_PASSWORD: deadlock_ci_password
          POSTGRES_DB: deadlock_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deadlock_ci -d deadlock_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://deadlock_ci:deadlock_ci_password@127.0.0.1:5432/deadlock_ci
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Bootstrap blank PostgreSQL
        run: |
          python -m app.migrate

      - name: Verify Alembic head
        run: |
          python -m alembic current --check-heads

      - name: Verify ORM schema
        run: |
          python -m alembic check

      - name: Test previous-to-current migration
        run: |
          python scripts/ci_migration_smoke.py

      - name: Verify final head
        run: |
          python -m alembic current --check-heads

  container:
    name: Docker / release image
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - migrations

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate production Compose
        env:
          DOMAIN: example.invalid
          CONTACT_EMAIL: ci@example.invalid
          ACME_EMAIL: ci@example.invalid
        run: |
          mkdir -p secrets

          for name in \
            postgres_password \
            database_url \
            session_secret \
            admin_totp_secret \
            deadlock_api_key \
            steam_web_api_key \
            telegram_bot_token \
            telegram_webhook_secret \
            discord_review_webhook_url
          do
            printf 'ci-placeholder\n' > "secrets/${name}.txt"
          done

          docker compose \
            -f compose.prod.yaml \
            config --quiet

      - name: Build release image
        run: |
          docker build \
            --tag deadlock-contracts:ci \
            .

      - name: Verify migration files in image
        run: |
          docker run --rm \
            --entrypoint sh \
            deadlock-contracts:ci \
            -lc '
              set -eu
              test -f /app/alembic.ini
              test -f /app/app/migrate.py
              test -f /app/alembic/versions/0004_add_outbox_retry_scheduling.py
              echo "release image OK"
            '