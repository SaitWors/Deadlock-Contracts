name: Codex frontend formatter

on:
  push:
    branches:
      - codex/remediation-20260823

permissions:
  contents: read

jobs:
  format:
    name: Materialize oxfmt output
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.19.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Dashboard
        run: pnpm exec oxfmt src/Dashboard.tsx

      - name: Upload formatted source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codex-formatted-dashboard-${{ github.sha }}
          path: frontend/src/Dashboard.tsx
          if-no-files-found: error
          retention-days: 1
