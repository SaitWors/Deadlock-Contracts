<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Connect Companion | Deadlock Contracts</title>
  <link rel="icon" href="/static/brand/favicon.ico">
  <link rel="stylesheet" href="/static/nightshift-documents.css">
  <script src="/static/document-appearance.js" defer></script>
  <script src="/static/pair.js" defer></script>
</head>
<body class="ns-static ns-documents">
  <header class="site-header">
    <div class="shell header-inner">
      <a id="home" class="brand" href="/en/"><img src="/static/brand/wordmark.png" alt="Deadlock Contracts" width="704" height="176"></a>
    </div>
  </header>
  <main class="shell legal-page">
    <article class="legal-document">
      <label for="language" id="language-label">Language</label>
      <select id="language">
        <option value="en" lang="en">English</option>
        <option value="ru" lang="ru">Русский</option>
      </select>
      <h1 id="heading">Connect the Companion</h1>
      <p id="status" role="status">Checking your connection request…</p>
      <div id="sign-in" hidden><a class="ghost-button" id="sign-in-link" href="/auth/steam?return_to=pair">Sign in with Steam</a></div>
      <div id="approval" hidden><button class="ghost-button" id="approve" type="button">Connect this Companion</button></div>
      <noscript><p>Enable JavaScript to connect, or open your website profile and generate a manual pairing code.</p></noscript>
      <h2 id="manual-heading">Using a pairing code</h2>
      <p id="manual-copy">Generate a Companion pairing code in your account settings. Then choose Settings → Use a pairing code in the Companion.</p>
      <p><a id="profile" href="/en/#profile">Open your profile</a></p>
    </article>
  </main>
</body>
</html>
