<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Connect Companion | Deadlock Contracts</title>
  <link rel="icon" type="image/svg+xml" href="/static/assets/mark.svg">
  <link rel="stylesheet" href="/static/nightshift-documents.css">
  <script src="/static/document-appearance.js" defer></script>
  <script src="/static/pair.js" defer></script>
</head>
<body class="ns-static ns-documents">
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="/en/"><span class="document-wordmark">DEADLOCK<small>CONTRACTS</small></span></a>
    </div>
  </header>
  <main class="shell legal-page">
    <article class="legal-document">
      <h1>Connect the Companion</h1>
      <p id="status" role="status">Checking your connection request…</p>
      <div id="sign-in" hidden><a class="ghost-button" href="/auth/steam?return_to=pair">Sign in with Steam</a></div>
      <div id="approval" hidden><button class="ghost-button" id="approve" type="button">Connect this Companion</button></div>
      <noscript><p>Enable JavaScript to connect, or open your website profile and generate a manual pairing code.</p></noscript>
      <h2>Using a pairing code</h2>
      <p>Open <a href="/en/#profile">your profile</a>, expand Account settings, and generate a Companion pairing code. Enter the code under Settings → Use a pairing code in the Companion.</p>
    </article>
  </main>
</body>
</html>
